<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeiroTranslate</title>
<link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="popup.css"></head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><img src="../../assets/icons/icon-128.png" class="logo" alt=""><div><div class="name">NeiroTranslate<span class="brand-dot">.</span></div><div class="tagline" data-i18n="popupTagline"></div></div></div>
    <div class="top-actions"><button class="ghost-btn" id="uiLangBtn" aria-label="Switch interface language">RU</button><button class="ghost-btn" id="settingsBtn" data-i18n-title="settings" data-i18n-aria="settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  </header>
  <section class="hero" id="hero" aria-label="Translation">
    <div class="orbital" aria-hidden="true"><i></i><i></i><i></i><svg class="orbital-star" viewBox="0 0 24 24" fill="currentColor"><path d="m12 1 3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></svg></div>
    <div class="hero-row"><div class="status" role="status"><span class="dot"></span><span id="statusText"></span></div><span class="timer" id="timer">0:00</span></div>
    <div class="lang-row"><label for="targetLang" data-i18n="translateTo"></label><select class="select" id="targetLang"></select></div>
    <button class="start-btn" id="toggleBtn"><svg class="icon play" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg><svg class="icon stopi" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span id="toggleLabel" data-i18n="start"></span><kbd>Alt Shift T</kbd></button>
  </section>
  <div class="problem hidden" id="problem" role="alert"><span id="problemText"></span><button class="link-btn" id="problemFix" data-i18n="openSettings"></button></div>
  <section class="block"><div class="block-title" id="sourceTitle" data-i18n="sourceTitle"></div><div class="sources" role="radiogroup" aria-labelledby="sourceTitle">
    <label class="source"><input type="radio" name="source" value="captions"><div class="source-body"><div class="source-head"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M7 10h4m2 0h4M7 14h3m3 0h4"/></svg><strong data-i18n="srcCaptions"></strong><span class="source-check"></span></div><small data-i18n="srcCaptionsDesc"></small></div></label>
    <label class="source"><input type="radio" name="source" value="gemini"><div class="source-body"><div class="source-head"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 10v4m4-7v10m5-13v16m5-13v10m4-7v4"/></svg><strong data-i18n="srcGemini"></strong><span class="source-check"></span></div><small data-i18n="srcGeminiDesc"></small></div></label>
  </div></section>
  <section class="block voice-block"><div class="section-row"><label class="block-title" for="voiceSelect" data-i18n="voiceTitle"></label><span class="provider-badge" id="voiceCost"></span></div>
    <select class="select" id="voiceSelect"><option value="browser" data-i18n="vBrowser"></option><option value="google" data-i18n="vGoogle"></option><option value="off" data-i18n="vOff"></option><option value="gemini" data-i18n="vGemini"></option><option value="elevenlabs" data-i18n="vEleven"></option><option value="yandex" data-i18n="vYandex"></option></select>
  </section>
  <details class="mixer"><summary><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 3v7m0 4v7M12 3v12m0 4v2M19 3v3m0 4v11"/><path d="M2 10h6m1 5h6m1-9h6"/></svg><span data-i18n="mixer"></span></span><span class="mix-summary" id="mixSummary"></span></summary><div class="mix-controls">
    <div class="mix-row"><label for="origVol" data-i18n="origVolume"></label><input type="range" id="origVol" class="range" min="0" max="100"><output id="origVolVal" for="origVol"></output></div>
    <div class="mix-row"><label for="dubVol" data-i18n="dubVolume"></label><input type="range" id="dubVol" class="range" min="0" max="150"><output id="dubVolVal" for="dubVol"></output></div>
    <p class="mix-hint" data-i18n="mixerHint"></p>
  </div></details>
  <section class="subs"><div class="section-row"><span class="block-title" data-i18n="liveSubs"></span><span class="cc-mark" aria-hidden="true">CC</span></div><div class="subs-orig" id="subsOrig"></div><div class="subs-text" id="subsText" aria-live="polite" data-i18n="waiting"></div></section>
  <footer class="foot"><button class="foot-btn" id="overlayBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg><span data-i18n="obs"></span></button><button class="foot-btn" id="statsBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 20V10m7 10V4m7 16v-7M2 20h20"/></svg><span data-i18n="stats"></span></button><span class="local-note" data-i18n="localSettings"></span></footer>
</main>
<script src="../shared/languages.js"></script><script src="../shared/settings.js"></script><script src="../shared/i18n.js"></script><script src="popup.js"></script>
</body></html>
